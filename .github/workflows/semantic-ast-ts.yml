name: Semantic AST TypeScript

on:
  push:
    paths:
      - "prototypes/semantic-ast-ts/**"
      - ".github/workflows/semantic-ast-ts.yml"
  pull_request:
    paths:
      - "prototypes/semantic-ast-ts/**"
      - ".github/workflows/semantic-ast-ts.yml"
  workflow_dispatch:

jobs:
  semantic-ast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/semantic-ast-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/semantic-ast-ts/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
